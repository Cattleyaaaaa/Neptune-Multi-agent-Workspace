[project]
name = "neptune-general-agent"
version = "0.1.0"
description = "Supervisor-driven general multi-agent workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langgraph>=0.6,<2",
  "pydantic-settings>=2.10,<3",
  "pyjwt>=2.14.0",
  "python-multipart>=0.0.32",
  "sse-starlette>=3,<4",
  "uvicorn[standard]>=0.35,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

# 本机要求：缓存不落 C 盘。相对路径跟着项目走，换机器也不用改。
# 注意 uv.toml 与这里的 [tool.uv] 二选一 —— 同时存在时 uv.toml 会整体压掉这里
# 的配置（包括下面的 index），所以只保留这一处。
[tool.uv]
cache-dir = ".uv-cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI 的依赖注入就是靠 `param = Depends(...)` 这种默认值写法声明的，
# 这不是 B008 想抓的"在默认值里做有副作用的事"。
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.File",
  "fastapi.Form",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/api", "packages/general_agent", "packages/contracts"]
